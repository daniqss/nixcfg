# raw mono levels for the quickshell osd visualiser, one line per frame:
# eight values in 0..100 separated by ';'
[general]
bars = 8
framerate = 60
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 77
